server {
    listen 80;

    # 1. Отдаем статику Vue
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Эта строчка нужна для Vue Router (режим history API),
        # чтобы при прямом заходе на /settings не было 404
        try_files $uri $uri/ /index.html; 
    }

    # 2. Проксируем всё, что начинается с /api, на наш бэкенд
    location /api/ {
        # В Kubernetes сервисы общаются по именам (DNS). 
        # Мы назовем наш бэкенд backend-service
        proxy_pass http://backend-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}